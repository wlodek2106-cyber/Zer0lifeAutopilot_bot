name: Zer0Life AI Trader foundation

on:
  workflow_dispatch:
  push:
    branches: [ai-trader-2027-foundation]
    paths:
      - "zerolife_ai_trader/**"
      - "custody_ledger.py"
      - "custody_runtime.py"
      - "main.py"
      - "index.html"
      - "static/dashboard.js"
      - "requirements.txt"
      - "tests/test_admin_overview.py"
      - "tests/test_admin_overview_auth.py"
      - "tests/test_zerolife_ai_trader.py"
      - "tests/test_zerolife_shadow.py"
      - ".github/workflows/zerolife-ai-trader.yml"
  pull_request:
    paths:
      - "zerolife_ai_trader/**"
      - "custody_ledger.py"
      - "custody_runtime.py"
      - "main.py"
      - "index.html"
      - "static/dashboard.js"
      - "requirements.txt"
      - "tests/test_admin_overview.py"
      - "tests/test_admin_overview_auth.py"
      - "tests/test_zerolife_ai_trader.py"
      - "tests/test_zerolife_shadow.py"
      - ".github/workflows/zerolife-ai-trader.yml"

permissions:
  contents: read

jobs:
  paper-foundation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install application dependencies needed by custody tests
        run: python -m pip install -r requirements.txt
      - name: Check dashboard JavaScript syntax
        run: node --check static/dashboard.js
      - name: Run isolated paper, shadow, and custody overview tests
        run: |
          python -m unittest discover -s tests -p 'test_zerolife_ai_trader.py' -v
          python -m unittest discover -s tests -p 'test_zerolife_shadow.py' -v
          python -m unittest discover -s tests -p 'test_admin_overview*.py' -v
          python -m unittest discover -s tests -p 'test_custody.py' -v
          python -m unittest discover -s tests -p 'test_wallet_runtime.py' -v
          python -m unittest discover -s tests -p 'test_web_access.py' -v
          python -m unittest discover -s tests -p 'test_account_security.py' -v
          python -m unittest discover -s tests -p 'test_security_headers.py' -v
          python -m unittest discover -s tests -p 'test_market_context.py' -v
