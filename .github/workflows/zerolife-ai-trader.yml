name: Zer0Life AI Trader foundation

on:
  workflow_dispatch:
  push:
    branches: [main, ai-trader-2027-foundation]
    paths:
      - "zerolife_ai_trader/**"
      - "tests/test_ai_trader_signal_engine.py"
      - "tests/test_ai_trader_backtest_strategies.py"
      - "tests/test_ai_trader_portfolio.py"
      - "tests/test_ai_trader_paper_store.py"
      - "tests/test_ai_trader_signal_dispatcher.py"
      - "tests/test_ai_trader_paper_bridge.py"
      - "tests/test_ai_trader_public_price.py"
      - "tests/test_ai_trader_paper_cycle.py"
      - "tests/test_ai_trader_paper_cycle_integration.py"
      - "tests/test_ai_trader_daily_pnl.py"
      - "custody_ledger.py"
      - "custody_runtime.py"
      - "main.py"
      - "index.html"
      - "static/dashboard.js"
      - "requirements.txt"
      - "tests/test_admin_overview.py"
      - "tests/test_admin_overview_auth.py"
      - "tests/test_zerolife_ai_trader.py"
      - "tests/test_ai_trader_settings.py"
      - "tests/test_ai_trader_paper_store.py"
      - "tests/test_ai_trader_settings.py"
      - "tests/test_ai_trader_configuration.py"
      - "tests/test_zerolife_shadow.py"
      - "tests/test_ai_trader_paper_bridge.py"
      - ".github/workflows/zerolife-ai-trader.yml"
  pull_request:
    paths:
      - "zerolife_ai_trader/**"
      - "tests/test_ai_trader_signal_engine.py"
      - "tests/test_ai_trader_backtest_strategies.py"
      - "tests/test_ai_trader_portfolio.py"
      - "tests/test_ai_trader_paper_store.py"
      - "tests/test_ai_trader_signal_dispatcher.py"
      - "tests/test_ai_trader_paper_bridge.py"
      - "tests/test_ai_trader_public_price.py"
      - "tests/test_ai_trader_paper_cycle.py"
      - "tests/test_ai_trader_paper_cycle_integration.py"
      - "tests/test_ai_trader_daily_pnl.py"
      - "tests/test_ai_trader_settings.py"
      - "tests/test_ai_trader_configuration.py"
      - "tests/test_ai_trader_binance_public.py"
      - "tests/test_ai_trader_paper_cycle_integration.py"
      - "zerolife_ai_trader/**"
      - "custody_ledger.py"
      - "custody_runtime.py"
      - "main.py"
      - "index.html"
      - "static/dashboard.js"
      - "requirements.txt"
      - "tests/test_admin_overview.py"
      - "tests/test_admin_overview_auth.py"
      - "tests/test_zerolife_ai_trader.py"
      - "tests/test_zerolife_shadow.py"
      - ".github/workflows/zerolife-ai-trader.yml"

permissions:
  contents: read

jobs:
  paper-foundation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install application dependencies needed by custody tests
        run: python -m pip install -r requirements.txt
      - name: Check dashboard JavaScript syntax
        run: node --check static/dashboard.js
      - name: Run isolated paper, shadow, and custody overview tests
        run: |
          python -m unittest discover -s tests -p 'test_zerolife_ai_trader.py' -v
          python -m unittest discover -s tests -p 'test_ai_trader_settings.py' -v
          python -m unittest discover -s tests -p 'test_ai_trader_configuration.py' -v
          python -m unittest discover -s tests -p 'test_ai_trader_signal_engine.py' -v
          python -m unittest discover -s tests -p 'test_ai_trader_binance_public.py' -v
          python -m unittest discover -s tests -p 'test_ai_trader_backtest_strategies.py' -v
          python -m unittest discover -s tests -p 'test_ai_trader_portfolio.py' -v
          python -m unittest discover -s tests -p 'test_ai_trader_paper_store.py' -v
          python -m unittest discover -s tests -p 'test_ai_trader_signal_dispatcher.py' -v
          python -m unittest discover -s tests -p 'test_ai_trader_paper_bridge.py' -v
          python -m unittest discover -s tests -p 'test_ai_trader_public_price.py' -v
          python -m unittest discover -s tests -p 'test_ai_trader_paper_cycle.py' -v
          python -m unittest discover -s tests -p 'test_ai_trader_paper_cycle_integration.py' -v
          python -m unittest discover -s tests -p 'test_ai_trader_daily_pnl.py' -v
          python -m unittest discover -s tests -p 'test_zerolife_shadow.py' -v
          python -m unittest discover -s tests -p 'test_admin_overview*.py' -v
          python -m unittest discover -s tests -p 'test_custody.py' -v
          python -m unittest discover -s tests -p 'test_wallet_runtime.py' -v
          python -m unittest discover -s tests -p 'test_web_access.py' -v
          python -m unittest discover -s tests -p 'test_account_security.py' -v
          python -m unittest discover -s tests -p 'test_security_headers.py' -v
          python -m unittest discover -s tests -p 'test_market_context.py' -v
          PYTHONPATH=tests python -m unittest test_activity_log.ActivityTests -v
          python -m unittest discover -s tests -p 'test_execution_policy.py' -v
          python -m unittest discover -s tests -p 'test_entry_costs.py' -v
          python -m unittest discover -s tests -p 'test_fee_reserve.py' -v
          python -m unittest discover -s tests -p 'test_trade_audit.py' -v
          python -m unittest discover -s tests -p 'test_real_trading_only.py' -v
          python -m unittest discover -s tests -p 'test_base_paper.py' -v
          python -m unittest discover -s tests -p 'test_rule_signals.py' -v
