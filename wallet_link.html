<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Подтверждение кошелька</title>
<style>body{background:#090c11;color:#fff;font:16px system-ui;max-width:540px;margin:40px auto;padding:24px}button,a{display:block;background:#21c869;color:#07120b;padding:16px;border:0;border-radius:12px;margin:20px 0;font:inherit;text-decoration:none}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#b6c7bf}</style>
<h2>Подтвердить свой кошелёк один раз</h2>
<p>Это подпись сообщения, не перевод. Деньги не списываются. Seed-фраза и приватный ключ не нужны.</p>
<a id="open">Открыть в Phantom</a><pre id="message"></pre><button id="sign" disabled>Подтвердить владение кошельком</button><p id="status"></p>
<script>
const endpoint = location.pathname;
const button = document.getElementById('sign'), status = document.getElementById('status');
const provider = () => window.phantom?.solana || window.solana || window.solflare;
document.getElementById('open').href = 'https://phantom.com/ul/browse/' + encodeURIComponent(location.href) + '?ref=' + encodeURIComponent(location.origin);
let challenge;
async function load() {
 try {
  const response = await fetch(endpoint + '/status', {cache:'no-store'});
  challenge = await response.json();
  if (!response.ok || !challenge.success) throw new Error(challenge.message);
  document.getElementById('message').textContent = challenge.message;
  button.disabled = challenge.linked || !provider();
  status.textContent = challenge.linked ? 'Кошелёк подтверждён. Вернитесь в Telegram, переведите средства обычным способом и вставьте Tx.' : 'Подпишите показанное сообщение в своём кошельке.';
  if (provider()) document.getElementById('open').style.display = 'none';
 } catch(e) {status.textContent = e.message;}
}
button.onclick = async () => {
 button.disabled = true;
 try {
  const wallet = provider(), connected = await wallet.connect();
  const address = (connected.publicKey || wallet.publicKey).toString();
  const signed = await wallet.signMessage(new TextEncoder().encode(challenge.message), 'utf8');
  const signature = btoa(String.fromCharCode(...(signed.signature || signed)));
  const response = await fetch(endpoint + '/confirm', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({address,signature})});
  const result = await response.json();
  if (!response.ok || !result.success) throw new Error(result.message);
  status.textContent = result.message;
 } catch(e) {status.textContent = e.message || 'Подтверждение отменено.'; button.disabled=false;}
};
load();
</script></html>
