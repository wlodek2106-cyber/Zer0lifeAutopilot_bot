<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zer0Life Ai Trader - Wallet</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --neon-green: #14f195;
            --neon-green-glow: rgba(20, 241, 149, 0.5);
            --bg-dark: #030407;
            --panel-bg: rgba(12, 14, 20, 0.65);
            --text-main: #ffffff;
            --text-muted: #8a8d98;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(20, 241, 149, 0.08) 0%, transparent 50%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-main);
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        .container {
            flex-grow: 1;
            padding: 20px 20px 110px 20px;
            overflow-y: auto;
        }

        .panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(20, 241, 149, 0.15);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        .panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 1px;
            background: linear-gradient(90deg, transparent, var(--neon-green), transparent);
            opacity: 0.3;
        }

        .panel-title {
            color: var(--text-main);
            font-size: 20px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background-color: var(--neon-green);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
            100% { transform: scale(0.95); opacity: 1; }
        }

        .panel-desc {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .input-label {
            font-size: 10px;
            color: var(--neon-green);
            text-transform: uppercase;
            font-weight: 800;
            margin-bottom: 8px;
            display: block;
            letter-spacing: 1px;
        }

        .address-box {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(20, 241, 149, 0.3);
            border-radius: 12px;
            padding: 16px 12px;
            color: var(--neon-green);
            font-size: 13px;
            font-family: 'Courier New', Courier, monospace;
            word-break: break-all;
            margin-bottom: 28px;
            text-align: center;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8);
        }

        .qr-container {
            display: flex;
            justify-content: center;
            margin-bottom: 28px;
            position: relative;
        }

        .qr-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 170px;
            height: 170px;
            background: var(--neon-green);
            filter: blur(40px);
            border-radius: 20px;
            opacity: 0.15;
            z-index: 0;
        }

        .qr-code {
            background: #ffffff;
            padding: 10px;
            border-radius: 16px;
            width: 160px;
            height: 160px;
            z-index: 1;
            position: relative;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .btn-primary {
            background: linear-gradient(135deg, #10b981 0%, var(--neon-green) 100%);
            color: #000;
            border: none;
            border-radius: 14px;
            padding: 16px;
            width: 100%;
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px var(--neon-green-glow);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-primary:active {
            transform: scale(0.97);
            box-shadow: 0 2px 8px rgba(20, 241, 149, 0.3);
        }

        .btn-secondary {
            background: rgba(20, 241, 149, 0.1);
            color: var(--neon-green);
            border: 1px solid rgba(20, 241, 149, 0.3);
            box-shadow: none;
        }

        .btn-secondary:active {
            background: rgba(20, 241, 149, 0.2);
        }

        .input-field {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 16px;
            color: #ffffff;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 20px;
            outline: none;
            transition: all 0.3s;
            font-family: monospace;
        }

        .input-field::placeholder {
            color: #4b5563;
            font-family: -apple-system, sans-serif;
        }

        .input-field:focus {
            border-color: var(--neon-green);
            box-shadow: 0 0 10px rgba(20, 241, 149, 0.2);
            background: rgba(0, 0, 0, 0.6);
        }

        .floating-nav {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            background: rgba(15, 18, 25, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            z-index: 10;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: var(--text-muted);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            flex: 1;
            font-weight: 700;
            padding: 8px 0;
            border-radius: 20px;
            transition: all 0.3s;
        }

        .nav-item.active {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-icon {
            font-size: 18px;
            margin-bottom: 2px;
            opacity: 0.7;
            transition: all 0.3s;
        }

        .nav-item.active .nav-icon {
            opacity: 1;
            transform: translateY(-2px);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Panel 1: Web4 Wallet Panel -->
        <div class="panel">
            <div class="panel-title">
                <div class="live-dot"></div>
                Web4 Wallet Panel
            </div>
            <div class="panel-desc">
                Ваш зашифрованный депозитный адрес и штрихкод для пополнения ликвидности SOL.
            </div>
            
            <label class="input-label">Депозитный адрес (Solana)</label>
            <div class="address-box" id="wallet-address">
                8hxiCofyaKCBkhR5nsDqvUivmfgxcVx8zo2WiCzSdM6L
            </div>

            <div class="qr-container">
                <div class="qr-glow"></div>
                <img class="qr-code" src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=8hxiCofyaKCBkhR5nsDqvUivmfgxcVx8zo2WiCzSdM6L" alt="QR Code">
            </div>

            <button class="btn-primary" onclick="copyAddress()">
                <span style="font-size: 16px;">📋</span> Копировать адрес
            </button>
        </div>

        <!-- Panel 2: Transaction Verification -->
        <div class="panel">
            <label class="input-label">Проверка транзакции (Signature)</label>
            <input type="text" class="input-field" placeholder="Вставьте tx_hash...">
            
            <button class="btn-primary btn-secondary" onclick="verifyTx()">
                Verify & Credit SOL 🔄
            </button>
        </div>
    </div>

    <div class="floating-nav">
        <div class="nav-item active">
            <span class="nav-icon">👛</span>
            <span>Wallet</span>
        </div>
        <div class="nav-item" onclick="tg.HapticFeedback.impactOccurred('light');">
            <span class="nav-icon">🤖</span>
            <span>Ai Trader</span>
        </div>
        <div class="nav-item" onclick="tg.HapticFeedback.impactOccurred('light');">
            <span class="nav-icon">📊</span>
            <span>Stats</span>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        
        tg.setHeaderColor('#030407');
        tg.setBackgroundColor('#030407');

        function copyAddress() {
            const address = document.getElementById('wallet-address').innerText.trim();
            navigator.clipboard.writeText(address).then(() => {
                tg.HapticFeedback.notificationOccurred('success');
                tg.showAlert('Адрес скопирован в буфер обмена!');
            }).catch(err => {
                console.error('Ошибка копирования', err);
            });
        }

        function verifyTx() {
            tg.HapticFeedback.impactOccurred('medium');
        }
    </script>
</body>
</html>
