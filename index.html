<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zer0lifeAutopilot Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 16px;
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .card {
            background: #1e293b;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .status-active {
            color: #22c55e;
            font-weight: bold;
        }
        .coin-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }
        .btn {
            background: #6366f1;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn:active { background: #4f46e5; }
    </style>
</head>
<body>
    <div class="header">
        <h2>🛡 Zer0life Autopilot</h2>
        <p>Статус: <span class="status-active">🟢 Активен (24/7)</span></p>
    </div>

    <div class="card">
        <h3>📊 Мониторинг DEX</h3>
        <div class="coin-row">
            <span>SOL / USDC</span>
            <span><b>$145.50</b> (HOLD)</span>
        </div>
        <div class="coin-row">
            <span>AVAX / USDC</span>
            <span><b>$25.80</b> (BUY_DIP)</span>
        </div>
    </div>

    <div class="card">
        <h3>⚙️ Управление</h3>
        <p>Автономный ИИ-агент сканирует ликвидность на просадках и защищает капитал.</p>
        <button class="btn" onclick="Telegram.WebApp.close()">Закрыть панель</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
    </script>
</body>
</html>
